name: Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify version
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag must match package.json' }
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - run: npm run package:win
      - run: node scripts/release-win.cjs
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $folder = Join-Path release "github-$env:GITHUB_REF_NAME"
          $assets = @(Get-ChildItem -LiteralPath $folder -File | Select-Object -ExpandProperty FullName)
          if ($assets.Count -ne 2) { throw 'Expected the interface bundle and Windows ZIP' }
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --generate-notes
